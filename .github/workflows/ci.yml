name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve generator dependencies
        run: dart pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed bin lib test

      - name: Analyze generator
        run: dart analyze

      - name: Test generator
        run: dart test

      - name: Activate local generator
        run: dart pub global activate --source path .

      - name: Generate and verify base application
        run: >-
          dart run bin/gold_flutter.dart create
          --display-name "CI Base"
          --project-name ci_base
          --application-id com.example.cibase
          --platforms android,web,linux
          --no-api
          --yes
          --output-directory "$RUNNER_TEMP"

      - name: Generate and verify complete API application
        run: >-
          dart run bin/gold_flutter.dart create
          --display-name "CI Complete"
          --project-name ci_complete
          --application-id com.example.cicomplete
          --platforms android,web,linux
          --api
          --api-base-url https://api.example.com
          --auth
          --refresh-tokens
          --sample-api
          --yes
          --output-directory "$RUNNER_TEMP"

      - name: Exercise every assistant command
        working-directory: ${{ runner.temp }}/ci_base
        run: |
          mkdir -p lib/domain/models
          cp "$GITHUB_WORKSPACE/tool/ci/example_model.dart" lib/domain/models/example_model.dart
          gold_flutter arrange model --path lib/domain/models/example_model.dart --yes
          gold_flutter add amount-formatter --yes
          gold_flutter docs --yes
          gold_flutter optimize --yes
          flutter analyze
          flutter test

  windows-installer-syntax:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: dart pub get --enforce-lockfile

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Run platform-neutral safety tests
        run: >-
          dart test
          test/unit/change/change_plan_test.dart
          test/unit/docs/documentation_manifest_test.dart

name: gold_flutter
description: Portable gold-standard Flutter project generator.
version: 0.2.0-dev
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

executables:
  gold_flutter: gold_flutter

dependencies:
  analyzer: ^7.7.1
  args: ^2.7.0
  crypto: ^3.0.7
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  # js 0.7.2 requires Dart 3.7; keep the test graph at this package's floor.
  js: 0.7.1
  lints: 5.0.0
  test: ^1.25.15
